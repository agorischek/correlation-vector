version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      development-routine:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
