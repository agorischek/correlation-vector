version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      development-routine:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8.x aborts when loaded with TypeScript 7's native API.
      # Keep receiving compatible TypeScript 5/6 updates until that support lands.
      - dependency-name: typescript
        versions:
          - '>=7'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
